[package]
authors = ["CHE3MZ"]
repository = "https://github.com/CHE3MZ/octorun"
name = "octorun"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
flate2 = "1.1.11"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tar = "0.4.46"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = "9.8.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
